<!DOCTYPE html>
<html>
<head>
  <title>Color Generator</title>

  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial;
    }

    .box {
      text-align: center;
      background: white;
      padding: 30px;
      border-radius: 15px;
    }

    button {
      padding: 12px 20px;
      border: none;
      background: black;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="box">
  <h1 id="color">#ffffff</h1>
  <button onclick="changeColor()">Generate Color</button>
</div>

<script>
  function changeColor() {
    const letters = "0123456789ABCDEF";
    let color = "#";

    for (let i = 0; i < 6; i++) {
      color += letters[Math.floor(Math.random() * 16)];
    }

    document.body.style.backgroundColor = color;
    document.getElementById("color").textContent = color;
  }
</script>

</body>
</html>
