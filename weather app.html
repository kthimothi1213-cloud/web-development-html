<!DOCTYPE html>
<html>
<head>
  <title>Password Generator</title>

  <style>
    body {
      font-family: Arial;
      background: #111827;
      color: white;
      display: flex;
      justify-content: center;
      padding-top: 100px;
    }

    .box {
      background: #1f2937;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
    }

    input {
      width: 300px;
      padding: 12px;
      font-size: 18px;
    }

    button {
      margin-top: 15px;
      padding: 12px 20px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>Password Generator</h2>

  <input id="password" readonly>

  <br>

  <button onclick="generatePassword()">Generate</button>

</div>

<script>
  function generatePassword() {

    const chars =
      "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";

    let password = "";

    for (let i = 0; i < 12; i++) {
      password += chars[Math.floor(Math.random() * chars.length)];
    }

    document.getElementById("password").value = password;
  }
</script>

</body>
</html>
